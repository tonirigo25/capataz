apply plugin: 'com.android.application'

def releaseKeystorePath = System.getenv("CAPATAZ_ANDROID_KEYSTORE_PATH") ?: project.findProperty("CAPATAZ_ANDROID_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("CAPATAZ_ANDROID_KEYSTORE_PASSWORD") ?: project.findProperty("CAPATAZ_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("CAPATAZ_ANDROID_KEY_ALIAS") ?: project.findProperty("CAPATAZ_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("CAPATAZ_ANDROID_KEY_PASSWORD") ?: project.findProperty("CAPATAZ_ANDROID_KEY_PASSWORD")
def mobileAppLinkHost = System.getenv("CAPATAZ_MOBILE_APP_LINK_HOST") ?: project.findProperty("CAPATAZ_MOBILE_APP_LINK_HOST") ?: "example.invalid"
def mobileUrlScheme = System.getenv("CAPATAZ_MOBILE_URL_SCHEME") ?: project.findProperty("CAPATAZ_MOBILE_URL_SCHEME") ?: "orqena"
def releaseSigningComplete = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "com.orqena.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.orqena.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0-rc.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [mobileAppLinkHost: mobileAppLinkHost, mobileUrlScheme: mobileUrlScheme]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningComplete) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningComplete) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task -> task.path.endsWith(":bundleRelease") || task.path.endsWith(":assembleRelease") }
    if (releaseRequested && !releaseSigningComplete) {
        throw new GradleException("Release signing is incomplete; use the external signing runbook and never store credentials in the repository")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
