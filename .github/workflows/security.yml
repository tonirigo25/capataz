name: Security and supply chain

on:
  pull_request:
  push:
    branches: [main, program/orqena-production-readiness]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx audit-ci --high
      - run: npm run readiness:scan-secrets
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mkdir -p artifacts && npm run security:sbom
      - run: npm run readiness:licenses -- --output artifacts/licenses.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: supply-chain-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@3b0bd1d116c0bde30213346b22d4f634d96a2fb0
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@3b0bd1d116c0bde30213346b22d4f634d96a2fb0
        with:
          category: /language:javascript-typescript
