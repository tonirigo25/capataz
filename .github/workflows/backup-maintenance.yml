name: Backup maintenance and restore drill

on:
  schedule:
    - cron: "31 2 * * *"
    - cron: "37 3 * * 0"
    - cron: "47 4 1 * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Safe maintenance operation
        required: true
        type: choice
        default: documents
        options:
          - documents
          - retention
          - restore-drill

permissions:
  contents: read
  issues: write

concurrency:
  group: production-backup-repository
  cancel-in-progress: false

jobs:
  documents:
    if: github.event.schedule == '31 2 * * *' || inputs.operation == 'documents'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: backup-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rclone
          rclone version
      - name: Copy production documents to the independent private bucket
        id: documents
        env:
          DOCUMENTS_SOURCE_R2_ACCESS_KEY_ID: ${{ secrets.DOCUMENTS_SOURCE_R2_ACCESS_KEY_ID }}
          DOCUMENTS_SOURCE_R2_SECRET_ACCESS_KEY: ${{ secrets.DOCUMENTS_SOURCE_R2_SECRET_ACCESS_KEY }}
          DOCUMENTS_SOURCE_R2_ENDPOINT: ${{ secrets.DOCUMENTS_SOURCE_R2_ENDPOINT }}
          DOCUMENTS_SOURCE_R2_BUCKET: ${{ secrets.DOCUMENTS_SOURCE_R2_BUCKET }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          BACKUP_R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
          BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
        run: bash scripts/operations/backup-documents.sh
      - name: Update success state
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/operations/update-backup-alert.mjs success production-documents-backup
      - name: Open or refresh a generic failure alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/operations/update-backup-alert.mjs failure production-documents-backup

  retention:
    if: github.event.schedule == '37 3 * * 0' || inputs.operation == 'retention'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: backup-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install restic
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends restic
          restic version
      - name: Apply retention and validate a data subset
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          RESTIC_REPOSITORY: s3:${{ secrets.BACKUP_R2_ENDPOINT }}/${{ secrets.BACKUP_R2_BUCKET }}/postgresql
        run: |
          restic forget --tag postgresql --group-by '' --keep-last 28 --keep-daily 14 --keep-weekly 8 --keep-monthly 12 --prune
          restic check --read-data-subset=5%
      - name: Update success state
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/operations/update-backup-alert.mjs success production-backup-retention
      - name: Open or refresh a generic failure alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/operations/update-backup-alert.mjs failure production-backup-retention

  restore-drill:
    if: github.event.schedule == '47 4 1 * *' || inputs.operation == 'restore-drill'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: backup-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install restic
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends restic
          restic version
      - name: Restore into an ephemeral local PostgreSQL container
        id: drill
        env:
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          BACKUP_R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
          BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
        run: bash scripts/operations/restore-drill.sh
      - name: Record safe drill summary
        env:
          RTO_SECONDS: ${{ steps.drill.outputs.rto_seconds }}
          MIGRATION_COUNT: ${{ steps.drill.outputs.migration_count }}
          MIGRATION_HEAD: ${{ steps.drill.outputs.migration_head }}
          CHECKSUM_PREFIX: ${{ steps.drill.outputs.checksum_prefix }}
        run: |
          {
            echo "### Isolated restore drill"
            echo
            echo "- Result: PASS"
            echo "- RTO measured: ${RTO_SECONDS}s"
            echo "- Migrations: ${MIGRATION_COUNT}"
            echo "- Migration head: ${MIGRATION_HEAD}"
            echo "- SHA-256 prefix: ${CHECKSUM_PREFIX}"
            echo "- Production database changed: no"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Update success state
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/operations/update-backup-alert.mjs success production-restore-drill
      - name: Open or refresh a generic failure alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/operations/update-backup-alert.mjs failure production-restore-drill
