name: Railway isolated preview gate

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify, provision or teardown an isolated PR preview
        required: true
        type: choice
        options: [verify, provision, teardown]
      pull_request_number:
        description: Pull request number
        required: true
        type: string
      expected_head_sha:
        description: Immutable PR head SHA
        required: true
        type: string
      isolation_approved:
        description: Confirm dedicated database, storage and credential scopes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preview-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: railway-preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fail-closed preview contract
        run: node scripts/readiness/validate-railway-preview-dispatch.mjs
        env:
          PREVIEW_OPERATION: ${{ inputs.operation }}
          PREVIEW_PR_NUMBER: ${{ inputs.pull_request_number }}
          PREVIEW_EXPECTED_SHA: ${{ inputs.expected_head_sha }}
          PREVIEW_ISOLATION_APPROVED: ${{ inputs.isolation_approved }}
      - name: External provider boundary
        run: echo "No Railway mutation is performed until RAILWAY-PREVIEW-001 is explicitly closed."
